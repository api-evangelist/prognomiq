aid: prognomiq
name: PrognomiQ
description: 'PrognomiQ Inc. is a Redwood City, California multi-omics diagnostics company, spun out
  of Seer (NASDAQ: SEER) in 2020, that combines proteomic, genomic, transcriptomic and metabolomic
  measurement with machine learning to detect cancer and other complex diseases earlier from a blood
  draw. Its first commercial product, ProVue Lung, is a proteomics-based laboratory developed test
  (LDT) intended to aid early detection of lung cancer. PrognomiQ is a clinical laboratory and life
  sciences business rather than a software vendor: as of this profile it publishes a six-page
  corporate marketing site, a public GitHub organization holding forks of open-source data-engineering
  tooling, and no public developer portal, API documentation or machine-readable API contract.'
